<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form</title>
</head>
<body>
 <div>
    <form action="index.html">
<label for="name">Enter Your Name:</label>
<br>
<input type="text" id="name" placeholder="Enter Your Name" required>
<br><br>
<label for="email">Enter Your Email:</label>
<br>
<input type="email" id="email" placeholder="Enter Your Email" required>
<br><br>
<label for="name">Enter Your Age:</label>
<br>
<input type="number" id="age" placeholder="Enter Your Age" required>
<br><br>
<label for="gender">Gender</label>
<br>
<label for="male">Male</label>
<input type="radio" id="male" name="gender" value="Male">
<label for="female">Female</label>
<input type="radio" id="female" name="gender" value="Female">
<br><br>
<label for="hobbies">Hobbies</label>
<br>
<label for="sports">Sports</label>
<input type="checkbox" id="sports">
<br>
<label for="arts">Arts</label>
<input type="checkbox" id="arts">
<br>
<label for="reading">Reading</label>
<input type="checkbox" id="reading">
<br>
<label for="volunteering">Volunteering</label>
<input type="checkbox" id="volunteering">
<br><br>
<label for="country">Select Your Country</label>
<br>
<select id="country">
    <option value="Select Your Country" selected disabled>Select Your Country</option>
     <option value="Pakistan">Pakistan</option>
     <option value="China">China</option>
     <option value="Indonesia">Indonesia</option>
     <option value="Iran">Iran</option>
     <option value="Iraq">Iraq</option>
</select>
<br><br>
<input type="submit">
</form>
</div>   
</body>
</html>
